<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f3" />
    <title>MLRIT Procurement</title>
    <!-- Fonts load without blocking first paint; system fonts show until they arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=M+PLUS+Rounded+1c:wght@800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=M+PLUS+Rounded+1c:wght@800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" /></noscript>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('mlrit_theme');
          if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0b0d');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Boot splash + logo loader. Lives here so it shows before the JS bundle loads;
         src/components/brand/Brand.jsx reuses these classes. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center;
        background: #f7f6f3; transition: opacity 0.35s ease;
      }
      html.dark #boot-splash { background: #0b0b0d; }
      #boot-splash.is-done { opacity: 0; pointer-events: none; }
      .mlrit-loader svg { display: block; overflow: visible; }
      .mlrit-loader-gear {
        transform-box: fill-box; transform-origin: 50% 55%;
        animation: mlrit-gear 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .mlrit-loader-sweep {
        transform-box: fill-box; transform-origin: 0 50%;
        animation: mlrit-sweep 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .mlrit-loader-arrow { animation: mlrit-arrow 1.8s ease infinite; }
      @keyframes mlrit-gear {
        0%, 100% { transform: rotate(-16deg) scale(0.94); }
        45%, 78% { transform: rotate(0deg) scale(1); }
      }
      @keyframes mlrit-sweep {
        0% { transform: scaleX(0); }
        50%, 100% { transform: scaleX(1); }
      }
      @keyframes mlrit-arrow {
        0%, 78% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .mlrit-loader-gear, .mlrit-loader-sweep, .mlrit-loader-arrow { animation: none; }
      }
    </style>
  </head>
